<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[SISTEMA INICIADO] - void-code v1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-box">
        <header class="terminal-header">
            <h1>[SISTEMA INICIADO] </h1>
            <p class="user-logged">Usuário logado: Beatriz</p>
        </header>
        
        <hr class="terminal-divider">
        
        <div class="terminal-content">
            <pre class="ascii-dino">
            / _)
   _.----._/ /
  /         /
 _/ (  | (  |
/__.-'|_|--|
        
            </pre>
            
            <div id="terminal-output">
                </div>
            
            <div class="input-line">
                <span class="prompt">&gt;</span>
                <input type="text" id="terminal-input" placeholder="Aguardando comando... (digite help)" autofocus autocomplete="off">
            </div>
        </div>
        
        <footer class="terminal-footer">
            <button id="btn-logout" onclick="window.location.reload()">&gt; Reiniciar Sistema</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
